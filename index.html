<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dribble</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container-fluid px-2 px-md-5 mt-4">
        <div class="d-flex align-items-center justify-content-between mb-4 mb-md-5">
            
            <div class="dropdown flex-shrink-0">
                <button class="btn border dropdown-toggle fw-bold" type="button" data-bs-toggle="dropdown">
                    Popular
                </button>
                <ul class="dropdown-menu">
                    <li><a class="dropdown-item" href="#">Following</a></li>
                    <li><a class="dropdown-item" href="#">Popular</a></li>
                    <li><a class="dropdown-item" href="#">New & Noteworthy</a></li>
                </ul>
            </div>

            <div class="flex-grow-1 mx-3 d-flex align-items-center overflow-hidden" style="max-width: 700px;">
                <ul class="nav nav-pills flex-nowrap scroll-container gap-1 justify-content-start" id="nav-scroll">
                    <li class="nav-item"><button class="nav-link active rounded-pill fw-bold" data-bs-toggle="pill">Discover</button></li>
                    <li class="nav-item"><button class="nav-link fw-bold text-dark text-nowrap" data-bs-toggle="pill">Animation</button></li>
                    <li class="nav-item"><button class="nav-link fw-bold text-dark text-nowrap" data-bs-toggle="pill">Branding</button></li>
                    <li class="nav-item"><button class="nav-link fw-bold text-dark text-nowrap" data-bs-toggle="pill">Illustration</button></li>
                    <li class="nav-item"><button class="nav-link fw-bold text-dark text-nowrap" data-bs-toggle="pill">Mobile</button></li>
                    <li class="nav-item"><button class="nav-link fw-bold text-dark text-nowrap" data-bs-toggle="pill">Print</button></li>
                    <li class="nav-item"><button class="nav-link fw-bold text-dark text-nowrap" data-bs-toggle="pill">Product Design</button></li>
                    <li class="nav-item"><button class="nav-link fw-bold text-dark text-nowrap" data-bs-toggle="pill">Typography</button></li>
                </ul>
                
                <button class="btn btn-link text-dark text-decoration-none fw-bold flex-shrink-0 px-2" onclick="sideScroll()"> > </button>
            </div>

            <div class="flex-shrink-0">
                <button class="btn border rounded-pill px-4 fw-bold">Filters</button>
            </div>
        </div>

        <div class="row row-cols-1 row-cols-sm-2 row-cols-lg-3 g-4">
            
            <div class="col">
                <div class="card border-0">
                    <img src="sm.png" class="card-img-top rounded-3 shadow-sm">
                    <div class="d-flex justify-content-between align-items-center mt-2 px-1">
                        <div class="d-flex align-items-center gap-2">
                            <img src="icon1.png" class="rounded-circle" width="24" height="24">
                            <span class="fw-bold small text-nowrap">Siege Media</span>
                        </div>

                        <div class="small text-muted text-nowrap">
                            <img src="heart.png" width="14"> 193 &nbsp; 
                            <img src="eye.png" width="14"> 67k
                        </div>
                    </div>
                </div>
            </div>
            <div class="col">
                <div class="card border-0 h-100">
                    <img src="oc.png" class="card-img-top rounded-3" alt="Orman Clark">
                    <div class="d-flex justify-content-between align-items-center mt-2 px-1">
                        <div class="d-flex align-items-center gap-2">
                            <img src="icon2.png" class="rounded-circle" width="24" height="24">
                            <span class="fw-bold small">Orman Clark</span>
                        </div>
                        <div class="small text-muted text-nowrap">
                            <img src="heart.png" width="14"> 98 &nbsp; <img src="eye.png" width="14"> 24k
                        </div>
                    </div>
                </div>
            </div>

            <div class="col">
                <div class="card border-0 h-100">
                    <img src="jc.png" class="card-img-top rounded-3" alt="Jordon Cheung">
                    <div class="d-flex justify-content-between align-items-center mt-2 px-1">
                        <div class="d-flex align-items-center gap-2">
                            <img src="icon3.png" class="rounded-circle" width="24" height="24">
                            <span class="fw-bold small">Jordon Cheung</span>
                        </div>
                        <div class="small text-muted text-nowrap">
                            <img src="heart.png" width="14"> 176 &nbsp; <img src="eye.png" width="14"> 57k
                        </div>
                    </div>
                </div>
            </div>

            <div class="col">
                <div class="card border-0 h-100">
                    <img src="ac.png" class="card-img-top rounded-3" alt="Aldo Crusher">
                    <div class="d-flex justify-content-between align-items-center mt-2 px-1">
                        <div class="d-flex align-items-center gap-2">
                            <img src="icon4.png" class="rounded-circle" width="24" height="24">
                            <span class="fw-bold small">Aldo Crusher</span>
                        </div>
                        <div class="small text-muted text-nowrap">
                            <img src="heart.png" width="14"> 65 &nbsp; <img src="eye.png" width="14"> 6.7k
                        </div>
                    </div>
                </div>
            </div>

            <div class="col">
                <div class="card border-0 h-100">
                    <img src="canto.png" class="card-img-top rounded-3" alt="Canto">
                    <div class="d-flex justify-content-between align-items-center mt-2 px-1">
                        <div class="d-flex align-items-center gap-2">
                            <img src="canto 1.png" class="rounded-circle" width="24" height="24">
                            <span class="fw-bold small">Canto</span>
                        </div>
                        <div class="small text-muted">Hide ads • Advertise</div>
                    </div>
                </div>
            </div>

            <div class="col">
                <div class="card border-0 h-100">
                    <img src="m.png" class="card-img-top rounded-3" alt="Ramy Wafaa">
                    <div class="d-flex justify-content-between align-items-center mt-2 px-1">
                        <div class="d-flex align-items-center gap-2">
                            <img src="icon6.png" class="rounded-circle" width="24" height="24">
                            <span class="fw-bold small">Ramy Wafaa</span>
                        </div>
                        <div class="small text-muted text-nowrap">
                            <img src="heart.png" width="14"> 513 &nbsp; <img src="eye.png" width="14"> 143k
                        </div>

                    </div>
                </div>
            </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        function sideScroll() {
            const nav = document.getElementById('nav-scroll');
            nav.scrollLeft += 150;
        }
    </script>
</body>
</html>
